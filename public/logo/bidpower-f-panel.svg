<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" role="img" aria-label="Bidpower">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#bg)"/>
  <!-- panel box -->
  <rect x="20" y="16" width="56" height="64" rx="8" fill="#0F2A66"/>
  <rect x="24" y="20" width="48" height="56" rx="5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
  <!-- breakers: 2 columns x 3 rows, the top-right one is ON -->
  <g>
    <rect x="29" y="25" width="17" height="12" rx="3" fill="#fff"/>
    <rect x="50" y="25" width="17" height="12" rx="3" fill="#F59E0B"/>
    <rect x="29" y="42" width="17" height="12" rx="3" fill="#fff" fill-opacity=".85"/>
    <rect x="50" y="42" width="17" height="12" rx="3" fill="#fff" fill-opacity=".85"/>
    <rect x="29" y="59" width="17" height="12" rx="3" fill="#fff" fill-opacity=".7"/>
    <rect x="50" y="59" width="17" height="12" rx="3" fill="#fff" fill-opacity=".7"/>
  </g>
  <!-- toggle marks -->
  <g stroke="#0F2A66" stroke-width="2.4" stroke-linecap="round">
    <path d="M34 28 H41"/><path d="M55 28 H62" stroke="#7C2D12"/>
    <path d="M34 47 H41"/><path d="M55 47 H62"/>
    <path d="M34 64 H41"/><path d="M55 64 H62"/>
  </g>
  <!-- spark on the live breaker -->
  <path d="M73 8 L66 21 H73 L69 32 L81 17 H73 L77 8 Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="112" y="63" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#0F172A">Bid<tspan fill="#2563EB">power</tspan></text>
</svg>
