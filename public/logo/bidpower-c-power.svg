<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="Bidpower">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#g)"/>
  <!-- power ring, open at the top -->
  <path d="M34 26 A26 26 0 1 0 62 26" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <!-- up arrow (the bid going up) as the power line -->
  <path d="M48 14 V44 M37 25 L48 14 L59 25" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="63" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#0F172A">Bid<tspan fill="#2563EB">power</tspan></text>
</svg>
